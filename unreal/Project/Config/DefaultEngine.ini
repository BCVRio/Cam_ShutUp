[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Nanite.ProjectEnabled=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkinCache.CompileShaders=True
; ray tracing skins every character through the GPU skin cache; at the default 128 MB only the first one kept updating (the rest froze)
r.SkinCache.SceneMemoryLimitInMB=1024
r.VirtualTextures=True
; hardware ray tracing for Lumen (RTX class card), virtual shadow maps for crisp contact shadows on the grass and kerbs
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.Shadow.Virtual.Enable=1
r.DefaultFeature.MotionBlur=False
; ray-traced sun shadows, Lumen reflections through hardware ray tracing with hit lighting, glass reflections
r.RayTracing.Shadows=1
r.Lumen.Reflections.HardwareRayTracing=1
r.Lumen.TranslucencyReflections.FrontLayer.Allow=1
r.Lumen.TranslucencyReflections.FrontLayer.Enable=1
; sharper image: TSR accumulates at 2x, a touch of tonemapper sharpening, finer virtual shadow pages for the sun, denser Nanite
r.TSR.History.ScreenPercentage=200
r.Tonemapper.Sharpen=0.5
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.0
r.Nanite.MaxPixelsPerEdge=0.75
; the full-size street textures (facades at 2048) need a bigger streaming pool
r.Streaming.PoolSize=4000
r.Streaming.MipBias=0

