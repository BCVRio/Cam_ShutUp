name: Build & Publish

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Roblox after building"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo and Lune
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          cache: true

      - name: Run tests (syntax compile + shared specs)
        run: lune run tests/run

      - name: Build place file
        run: |
          mkdir -p build
          rojo build -o build/StealANunhead.rbxl

      - name: Upload place file artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealANunhead.rbxl
          path: build/StealANunhead.rbxl

      # Publishes on pushes to main, or when triggered manually with publish=true.
      # Needs repository secrets: ROBLOX_API_KEY, ROBLOX_UNIVERSE_ID, ROBLOX_PLACE_ID.
      - name: Publish to Roblox
        if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || inputs.publish }}
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        run: python scripts/publish_place.py
