# Deploy the game to GitHub Pages on every push to the game branch.
# The site is the repo as-is (index.html + src/ + public/), served at https://<owner>.github.io/<repo>/
name: Deploy to GitHub Pages
on:
  push:
    branches: [cam-shutup-game, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site (static copy without the Unreal project and tooling)
        run: |
          mkdir -p _site
          cp -r index.html src public _site/
          cp manifest.webmanifest README.md _site/ 2>/dev/null || true
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
